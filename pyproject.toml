[project]
name = "rshb-svoevino1"
version = "0.1.0"
description = "Локальный каталог российских вин с детерминированной загрузкой vino-svoe.ru"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
